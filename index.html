<div class="app" id="app">

    <div class="sb-head">
      <a class="sb-brand" href="#inicio" aria-label="Início">
        <span class="emblem" aria-hidden="true">
          <svg viewBox="0 0 40 46"><path d="M20 1 38 7v15c0 11-7.6 19.6-18 23C9.6 41.6 2 33 2 22V7Z" fill="var(--red)"/><path d="M20 5.5 34 10.2V22c0 8.6-5.8 15.6-14 18.6C11.8 37.6 6 30.6 6 22V10.2Z" fill="none" stroke="var(--gold)" stroke-width="1.4"/><text x="20" y="27" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="11" fill="#fff">1ª</text></svg>
        </span>
        <span class="emblem bbm" aria-hidden="true"></span>
        <span class="sb-brand-txt">
          <strong>1ª Cia Op</strong>
          <small>6º BBM / CBMMG</small>
        </span>
      </a>
      <button class="icon-btn sb-collapse" id="sbCollapse" type="button" aria-label="Recolher menu"></button>

    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <button class="sync" id="syncInfo" type="button"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-in">
        <button class="icon-btn tb-menu" id="tbMenu" type="button" aria-label="Abrir menu"></button>
        <div class="tb-title">
          <span class="tb-crumb" id="tbCrumb">Início</span>
          <h1 id="tbTitle">Painel de Gestão Operacional</h1>
        </div>
        <div class="tb-actions">
          <div class="duty-mini" id="dutyMini" title="Pelotão de serviço hoje"></div>
          <label class="search" for="globalSearch">
            <span class="ico" data-i="search"></span>
            <input id="globalSearch" type="search" placeholder="Buscar militar, nº BM" autocomplete="off">
            <div class="search-pop" id="searchPop" hidden></div>
          </label>
          <button class="icon-btn" id="atualizaBtn" type="button" aria-label="Atualizar dados" title="Ler as planilhas de novo (use depois de alterar uma planilha)"></button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema"></button>
          <button class="user-chip" id="userChip" type="button" aria-label="Conta">
            <span class="avatar">CB</span>
          </button>
        </div>
      </div>
      <div class="demo-band" id="demoBand">Modo demonstração: todos os nomes e números são fictícios. Conecte as planilhas em <code>assets/js/config.js</code>.</div>
    </header>

    <main class="content" id="view" tabindex="-1"></main>

    <footer class="foot">
      <span id="footUpd"></span>
      <span id="footVer">Uso interno da 1ª Cia Operacional / 6º BBM</span>
    </footer>
  </div>

  <!-- Navegação inferior (celular) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Atalhos"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
